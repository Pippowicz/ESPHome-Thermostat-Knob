# Gerätekonfiguration für den Elecrow ESP32-S3 Knob mit 240 x 240 Pixeln.
# Gerätenamen unten anpassen; Zugangsdaten stehen ausschließlich in secrets.yaml.
substitutions:
  # "false": autarker Betrieb. Alternativ die ID einer vorhandenen HA-Climate-Entität.
  # Im HA-Modus am ESPHome-Gerät die Ausführung von HA-Aktionen erlauben.
  thermostat_entity: "false"
  # Gemeinsamer Branch oder Commit für Komponente, Icons und Schriften.
  project_ref: development

  # Optionale Overrides: Ohne diese Angaben gelten die Defaults der Packages.
  # Alle Möglichkeiten und Standardwerte: packages/README.md
  # humidity_icon: "mdi:water-percent"
  # humidity_icon_size: "32x32"
  # font_file: "gfonts://Roboto"
  # thermostat_font_size: "40"
  # menu_font_file: "gfonts://Open Sans"

# Lädt die C++-Displaylogik. Änderungen werden erst nach Kompilieren/Flashen aktiv.
external_components:
  - source:
      type: git
      url: https://github.com/Pippowicz/ESPHome-Thermostat-Knob
      ref: ${project_ref}
    components: [round_thermostat]
    refresh: 0s # Git bei jeder Validierung bzw. jedem Build auf Änderungen prüfen.

# Lädt die image:- und font:-Definitionen samt überschreibbaren Defaults.
# external_components allein lädt keine YAML-Packages. Keine doppelten Asset-IDs anlegen.
packages:
  thermostat_assets:
    url: https://github.com/Pippowicz/ESPHome-Thermostat-Knob
    ref: ${project_ref}
    files:
      - packages/images.yaml
      - packages/fonts.yaml
    refresh: 0s

# Verknüpfung der Displaylogik mit den unten bzw. in den Packages definierten IDs.
# Links steht der Komponentenparameter, rechts die ID des verwendeten Bausteins.
# Icons/Fonts über Substitutions ändern; diese ID-Zuordnungen normalerweise beibehalten.
round_thermostat:
  id: thermostat_ui
  source_entity: ${thermostat_entity}
  # Display, lokale Climate-Entität und Hintergrundbeleuchtung.
  round_display: round_display
  thermostat_climate: thermostat_climate
  display_backlight: display_backlight
  # Messwert-Eingaben für den autarken Betrieb; HA-Modus liest Werte aus der Quelle.
  room_temperature: room_temperature
  room_humidity: room_humidity
  # Laufzeit-Einstellungen und Statusanzeigen aus Home Assistant.
  standby_brightness: standby_brightness
  standby_timeout: standby_timeout
  temperature_step: temperature_step
  humidity_display: humidity_display
  heating_source: heating_source
  window_open: window_open
  notification_present: notification_present
  notification_text: notification_text
  notification_acknowledged: notification_acknowledged
  # Diese Schriften und Icons werden von den Packages bereitgestellt.
  thermostat_font: thermostat_font
  standby_temperature_font: standby_temperature_font
  room_temperature_font: room_temperature_font
  menu_font: menu_font
  notification_font: notification_font
  mode_auto_icon: mode_auto_icon
  mode_heat_icon: mode_heat_icon
  mode_cool_icon: mode_cool_icon
  mode_off_icon: mode_off_icon
  standby_mode_auto_icon: standby_mode_auto_icon
  standby_mode_heat_icon: standby_mode_heat_icon
  standby_mode_cool_icon: standby_mode_cool_icon
  standby_mode_off_icon: standby_mode_off_icon
  room_temperature_icon: room_temperature_icon
  room_humidity_icon: room_humidity_icon
  heat_source_heatpump_icon: heat_source_heatpump_icon
  heat_source_radiator_icon: heat_source_radiator_icon
  heat_source_ac_icon: heat_source_ac_icon
  window_open_icon: window_open_icon
  notification_icon: notification_icon

# Diese Namen sowie climate.name an den jeweiligen Raum anpassen.
esphome:
  name: temperaturregler-wohnzimmer
  friendly_name: Temperaturregler Wohnzimmer
  on_boot:
    # UI nach der Komponenteninitialisierung und Wiederherstellung starten.
    priority: -100
    then:
      - logger.log: "Display backlight restored"
      - delay: 200ms
      - output.turn_off: power_light
      - output.turn_on: board_out1
      - output.turn_on: board_out2
      - lambda: |-
          id(thermostat_ui).start();

# Hardware-Einstellungen und Pins gehören zum angegebenen Elecrow-Board.
esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf

# Externer RAM wird unter anderem für die vorberechnete Displaygrafik benötigt.
psram:
  mode: octal
  speed: 80MHz

# DEBUG erleichtert die Fehlersuche; bei Bedarf später auf INFO reduzieren.
logger:
  level: DEBUG

# Lokale HA-Anbindung; Verschlüsselungsschlüssel aus secrets.yaml.
api:
  encryption:
    key: !secret encryption_key

# Firmware-Updates über das Netzwerk.
ota:
  - platform: esphome
    encryption:

# Der Fallback-Access-Point hilft bei nicht verfügbarer WLAN-Verbindung.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Temp Regler Fallback
    password: !secret fallback_hotspot_password

captive_portal:

# Touchcontroller über I²C, Display über SPI.
i2c:
  - id: touch_i2c_bus
    sda: GPIO6
    scl: GPIO7
    scan: true
    frequency: 400kHz

spi:
  id: display_spi
  clk_pin: GPIO10
  mosi_pin: GPIO11

# Die Komponente entscheidet, wann neu gezeichnet wird, und zeichnet das ganze Bild.
# update_interval und auto_clear_enabled deshalb beibehalten.
display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    spi_id: display_spi
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    color_order: BGR
    dimensions: 240x240
    update_interval: never
    auto_clear_enabled: false

    lambda: |-
      id(thermostat_ui).render(it);

# Touchkoordinaten an die UI weitergeben; Menü und Standby behandelt die Komponente.
touchscreen:
  - platform: cst816
    id: touchscreen_cst816
    i2c_id: touch_i2c_bus
    display: round_display
    interrupt_pin: GPIO5
    reset_pin: GPIO13
    skip_probe: true
    update_interval: 30ms

    calibration:
      x_min: 0
      x_max: 240
      y_min: 0
      y_max: 240

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    on_touch:
      - lambda: |-
          id(thermostat_ui).touch(touch.x, touch.y);

    on_release:
      - logger.log: "TOUCH released"

# Interner Drehgeber: relative Schritte an die UI, keine eigene HA-Sensorentität.
sensor:
  - platform: rotary_encoder
    id: thermostat_encoder
    internal: true

    pin_a:
      number: GPIO45
      mode:
        input: true
        pullup: true

    pin_b:
      number: GPIO42
      mode:
        input: true
        pullup: true

    resolution: 1

    on_clockwise:
      - lambda: id(thermostat_ui).rotate(1);
    on_anticlockwise:
      - lambda: id(thermostat_ui).rotate(-1);

# Lokale Bedienentität des Knobs, auch im HA-Modus erforderlich.
# Autark: Sollwert/Betriebsart für externe Automationen, keine eigene Heizungsregelung.
# HA-Modus: Bedienbefehle gehen an source_entity; Rückmeldungen aktualisieren die UI.
climate:
  - platform: template
    id: thermostat_climate
    name: "Temperaturregler Wohnzimmer"
    optimistic: true

    # UI-Modi. Im HA-Modus akzeptiert die Komponente nur von der Quelle angebotene Modi.
    supported_modes:
      - "OFF"
      - HEAT
      - COOL
      - AUTO

    restore_mode: RESTORE

    # Startwerte ohne gespeicherten Zustand; im HA-Modus gilt die Rückmeldung der Quelle.
    initial_state:
      mode: AUTO
      target_temperature: 21.0

    # Autarke Anzeigegrenzen; im HA-Modus werden die Grenzen der Quelle übernommen.
    visual:
      min_temperature: 5.0
      max_temperature: 30.0
      temperature_step: 0.5

    set_target_temperature_action:
      - lambda: id(thermostat_ui).set_target_temperature(x);
    set_mode_action:
      - lambda: id(thermostat_ui).set_mode(x);

# Schreibbare Anzeige-Eingaben, keine eingebauten Temperatur-/Feuchtesensoren.
# Nur autark verwendet: z. B. per HA-Automation mit echten Messwerten versorgen.
number:
  - platform: template
    id: room_temperature
    name: "Isttemperatur"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 40
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    initial_value: 20.0

    on_value:
      - lambda: id(thermostat_ui).redraw();

  - platform: template
    id: room_humidity
    name: "Luftfeuchtigkeit"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    initial_value: 50

    on_value:
      - lambda: id(thermostat_ui).redraw();

  # Helligkeit während Standby; bleibt auch im HA-Modus einstellbar.
  - platform: template
    id: standby_brightness
    name: "Standby Helligkeit"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    initial_value: 20

    on_value:
      - lambda: id(thermostat_ui).standby_brightness_changed(x);

  # Inaktivitätsdauer bis Standby, in Sekunden.
  - platform: template
    id: standby_timeout
    name: "Timeout"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 1800
    step: 1
    unit_of_measurement: "s"
    mode: box
    initial_value: 300

# Nachrichtentext; notification_present steuert die Anzeige des Popups.
text:
  - platform: template
    id: notification_text
    name: "Benachrichtigung"
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    mode: text
    initial_value: ""

    on_value:
      - lambda: id(thermostat_ui).notification_changed();

# Einstellungen, die ohne erneutes Flashen über HA geändert werden können.
select:
  - platform: template
    id: temperature_step
    # Im HA-Modus wird mindestens die Schrittweite der Quelle verwendet.
    name: "Temperatur Schrittweite"
    entity_category: config
    optimistic: true
    restore_value: true

    options:
      - "0.5 °C"
      - "1.0 °C"

    initial_option: "0.5 °C"

  - platform: template
    id: humidity_display
    name: "Luftfeuchtigkeit Anzeige"
    entity_category: config
    optimistic: true
    restore_value: true

    options:
      - "An"
      - "Aus"

    initial_option: "Aus"

    on_value:
      - lambda: |-
          id(thermostat_ui).redraw(true);

  # Reine Icon-Auswahl: schaltet selbst weder Heizkörper noch Klimaanlage um.
  - platform: template
    id: heating_source
    name: "Heizquelle"
    optimistic: true
    restore_value: true

    options:
      - "Wärmepumpe"
      - "Heizkörper"
      - "Klimaanlage"

    initial_option: "Wärmepumpe"

    on_value:
      - lambda: |-
          id(thermostat_ui).redraw(true);

# Anzeigezustände aus HA; das Fenstersymbol schaltet die Heizung nicht selbst ab.
switch:
  - platform: template
    id: window_open
    name: "Fenster offen"
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF

    turn_on_action:
      - lambda: |-
          id(window_open).publish_state(true);
          id(thermostat_ui).redraw(true);

    turn_off_action:
      - lambda: |-
          id(window_open).publish_state(false);
          id(thermostat_ui).redraw(true);

  - platform: template
    id: notification_present
    name: "Benachrichtigung vorhanden"
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF

    turn_on_action:
      - lambda: |-
          id(notification_present).publish_state(true);
          id(thermostat_ui).redraw(true);

    turn_off_action:
      - lambda: |-
          id(notification_present).publish_state(false);
          id(thermostat_ui).redraw(true);

# Kurzer Bestätigungsimpuls (500 ms) nach Quittieren einer Nachricht am Knob.
# HA kann darauf reagieren und Text sowie notification_present zurücksetzen.
binary_sensor:
  - platform: template
    id: notification_acknowledged
    name: "Benachrichtigung bestätigt"

# Physische Ausgänge: Display-PWM, Power-LED und die beim Boot gesetzten Board-Pins.
output:
  - platform: ledc
    id: display_backlight_pwm
    pin: GPIO46
    frequency: 5000Hz

  - platform: gpio
    id: power_light
    pin: GPIO40

  - platform: gpio
    id: board_out1
    pin: GPIO1

  - platform: gpio
    id: board_out2
    pin: GPIO2

# Displayhelligkeit und RGB-Ring sind getrennte HA-Lichtentitäten.
light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Hintergrundbeleuchtung"
    output: display_backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s

  - platform: esp32_rmt_led_strip
    id: rgb_ring
    name: "RGB Ring"
    pin: GPIO48
    num_leds: 5
    chipset: WS2812
    channel_colors: GRB
    restore_mode: RESTORE_DEFAULT_OFF

    effects:
      - pulse:
          name: "Pulsierend"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 15%
          max_brightness: 100%
