esphome:
  name: temperaturregler-wohnzimmer
  friendly_name: Temperaturregler Wohnzimmer
  on_boot:
    priority: -100
    then:
      - logger.log: "Display backlight restored"
      - delay: 200ms
      - output.turn_off: power_light
      - output.turn_on: board_out1
      - output.turn_on: board_out2
      - lambda: |-
          if (!isnan(id(thermostat_climate).target_temperature)) {
            id(thermostat_setpoint) =
                id(thermostat_climate).target_temperature;
            ESP_LOGI(
              "thermostat",
              "Wiederhergestellter Sollwert -> %.1f °C",
              id(thermostat_setpoint)
            );
          }

          id(last_activity_ms) = millis();
          id(standby_active) = false;
          id(mode_menu_open) = false;
          id(notification_popup_open) = false;
          id(force_full_redraw) = true;

      - component.update: round_display

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Temp Regler Fallback
    password: !secret fallback_hotspot_password

captive_portal:

globals:
  - id: thermostat_setpoint
    type: float
    restore_value: no
    initial_value: '21.0'

  - id: mode_menu_open
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: notification_popup_open
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: force_full_redraw
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: standby_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: last_activity_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: normal_backlight_brightness
    type: float
    restore_value: no
    initial_value: '1.0'

i2c:
  - id: touch_i2c_bus
    sda: GPIO6
    scl: GPIO7
    scan: true
    frequency: 400kHz

spi:
  id: display_spi
  clk_pin: GPIO10
  mosi_pin: GPIO11

font:
  - file: "gfonts://Roboto"
    id: thermostat_font
    size: 38

  - file: "gfonts://Roboto"
    id: standby_temperature_font
    size: 57

  - file: "gfonts://Roboto"
    id: room_temperature_font
    size: 18

  - file: "gfonts://Roboto"
    id: menu_font
    size: 16
    glyphs:
      - " !\"%()+,-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°äöüÄÖÜß"

  - file: "gfonts://Roboto"
    id: notification_font
    size: 18
    glyphs:
      - " !\"%()+,-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°äöüÄÖÜß?"

