substitutions:
  # "false": independent knob; otherwise an existing HA climate entity.
  thermostat_entity: "false" # e.g. "climate.hmip_heating_int0000008"

# Local component; copy the components directory alongside this YAML.
external_components:
  - source:
      type: local
      path: components
    components: [round_thermostat]

round_thermostat:
  id: thermostat_ui
  source_entity: ${thermostat_entity}
  round_display: round_display
  thermostat_climate: thermostat_climate
  display_backlight: display_backlight
  room_temperature: room_temperature
  room_humidity: room_humidity
  standby_brightness: standby_brightness
  standby_timeout: standby_timeout
  temperature_step: temperature_step
  humidity_display: humidity_display
  heating_source: heating_source
  window_open: window_open
  notification_present: notification_present
  notification_text: notification_text
  notification_acknowledged: notification_acknowledged
  thermostat_font: thermostat_font
  standby_temperature_font: standby_temperature_font
  room_temperature_font: room_temperature_font
  menu_font: menu_font
  notification_font: notification_font
  mode_auto_icon: mode_auto_icon
  mode_heat_icon: mode_heat_icon
  mode_cool_icon: mode_cool_icon
  mode_off_icon: mode_off_icon
  standby_mode_auto_icon: standby_mode_auto_icon
  standby_mode_heat_icon: standby_mode_heat_icon
  standby_mode_cool_icon: standby_mode_cool_icon
  standby_mode_off_icon: standby_mode_off_icon
  room_temperature_icon: room_temperature_icon
  room_humidity_icon: room_humidity_icon
  heat_source_heatpump_icon: heat_source_heatpump_icon
  heat_source_radiator_icon: heat_source_radiator_icon
  heat_source_ac_icon: heat_source_ac_icon
  window_open_icon: window_open_icon
  notification_icon: notification_icon

esphome:
  name: temperaturregler-wohnzimmer
  friendly_name: Temperaturregler Wohnzimmer
  on_boot:
    priority: -100
    then:
      - logger.log: "Display backlight restored"
      - delay: 200ms
      - output.turn_off: power_light
      - output.turn_on: board_out1
      - output.turn_on: board_out2
      - lambda: |-
          id(thermostat_ui).start();

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Temp Regler Fallback
    password: !secret fallback_hotspot_password

captive_portal:

i2c:
  - id: touch_i2c_bus
    sda: GPIO6
    scl: GPIO7
    scan: true
    frequency: 400kHz

spi:
  id: display_spi
  clk_pin: GPIO10
  mosi_pin: GPIO11

font:
  - file: "gfonts://Roboto"
    id: thermostat_font
    size: 38

  - file: "gfonts://Roboto"
    id: standby_temperature_font
    size: 57

  - file: "gfonts://Roboto"
    id: room_temperature_font
    size: 18

  - file: "gfonts://Roboto"
    id: menu_font
    size: 16
    glyphs:
      - " !\"%()+,-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°äöüÄÖÜß"

  - file: "gfonts://Roboto"
    id: notification_font
    size: 18
    glyphs:
      - " !\"%()+,-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°äöüÄÖÜß?"

image:
  - platform: file
    file: "mdi:refresh"
    id: mode_auto_icon
    type: BINARY
    transparency: chroma_key
    resize: 28x28

  - platform: file
    file: "mdi:fire"
    id: mode_heat_icon
    type: BINARY
    transparency: chroma_key
    resize: 28x28

  - platform: file
    file: "mdi:snowflake"
    id: mode_cool_icon
    type: BINARY
    transparency: chroma_key
    resize: 28x28

  - platform: file
    file: "mdi:circle-off-outline"
    id: mode_off_icon
    type: BINARY
    transparency: chroma_key
    resize: 28x28

  - platform: file
    file: "mdi:refresh"
    id: standby_mode_auto_icon
    type: BINARY
    transparency: chroma_key
    resize: 42x42

  - platform: file
    file: "mdi:fire"
    id: standby_mode_heat_icon
    type: BINARY
    transparency: chroma_key
    resize: 42x42

  - platform: file
    file: "mdi:snowflake"
    id: standby_mode_cool_icon
    type: BINARY
    transparency: chroma_key
    resize: 42x42

  - platform: file
    file: "mdi:circle-off-outline"
    id: standby_mode_off_icon
    type: BINARY
    transparency: chroma_key
    resize: 42x42

  - platform: file
    file: "mdi:thermometer"
    id: room_temperature_icon
    type: BINARY
    transparency: chroma_key
    resize: 28x28

  - platform: file
    file: "mdi:water"
    id: room_humidity_icon
    type: BINARY
    transparency: chroma_key
    resize: 28x28

  - platform: file
    file: "mdi:fan"
    id: heat_source_heatpump_icon
    type: BINARY
    transparency: chroma_key
    resize: 28x28

  - platform: file
    file: "mdi:radiator"
    id: heat_source_radiator_icon
    type: BINARY
    transparency: chroma_key
    resize: 28x28

  - platform: file
    file: "mdi:air-conditioner"
    id: heat_source_ac_icon
    type: BINARY
    transparency: chroma_key
    resize: 28x28

  - platform: file
    file: "mdi:window-open-variant"
    id: window_open_icon
    type: BINARY
    transparency: chroma_key
    resize: 28x28

  - platform: file
    file: "mdi:exclamation-thick"
    id: notification_icon
    type: BINARY
    transparency: chroma_key
    resize: 28x28

display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    spi_id: display_spi
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    color_order: BGR
    dimensions: 240x240
    update_interval: never
    auto_clear_enabled: false

    lambda: |-
      id(thermostat_ui).render(it);

touchscreen:
  - platform: cst816
    id: touchscreen_cst816
    i2c_id: touch_i2c_bus
    display: round_display
    interrupt_pin: GPIO5
    reset_pin: GPIO13
    skip_probe: true
    update_interval: 30ms

    calibration:
      x_min: 0
      x_max: 240
      y_min: 0
      y_max: 240

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    on_touch:
      - lambda: |-
          id(thermostat_ui).touch(touch.x, touch.y);

    on_release:
      - logger.log: "TOUCH released"

sensor:
  - platform: rotary_encoder
    id: thermostat_encoder
    internal: true

    pin_a:
      number: GPIO45
      mode:
        input: true
        pullup: true

    pin_b:
      number: GPIO42
      mode:
        input: true
        pullup: true

    resolution: 1

    on_clockwise:
      - lambda: id(thermostat_ui).rotate(1);
    on_anticlockwise:
      - lambda: id(thermostat_ui).rotate(-1);

climate:
  - platform: template
    id: thermostat_climate
    name: "Temperaturregler Wohnzimmer"
    optimistic: true

    supported_modes:
      - "OFF"
      - HEAT
      - COOL
      - AUTO

    restore_mode: RESTORE

    initial_state:
      mode: AUTO
      target_temperature: 21.0

    visual:
      min_temperature: 5.0
      max_temperature: 30.0
      temperature_step: 0.5

    set_target_temperature_action:
      - lambda: id(thermostat_ui).set_target_temperature(x);
    set_mode_action:
      - lambda: id(thermostat_ui).set_mode(x);

number:
  - platform: template
    id: room_temperature
    name: "Isttemperatur"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 40
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    initial_value: 20.0

    on_value:
      - lambda: id(thermostat_ui).redraw();

  - platform: template
    id: room_humidity
    name: "Luftfeuchtigkeit"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    initial_value: 50

    on_value:
      - lambda: id(thermostat_ui).redraw();

  - platform: template
    id: standby_brightness
    name: "Standby Helligkeit"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    initial_value: 20

    on_value:
      - lambda: id(thermostat_ui).standby_brightness_changed(x);

  - platform: template
    id: standby_timeout
    name: "Timeout"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 1800
    step: 1
    unit_of_measurement: "s"
    mode: box
    initial_value: 300

text:
  - platform: template
    id: notification_text
    name: "Benachrichtigung"
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    mode: text
    initial_value: ""

    on_value:
      - lambda: id(thermostat_ui).notification_changed();

select:
  - platform: template
    id: temperature_step
    name: "Temperatur Schrittweite"
    entity_category: config
    optimistic: true
    restore_value: true

    options:
      - "0.5 °C"
      - "1.0 °C"

    initial_option: "0.5 °C"

  - platform: template
    id: humidity_display
    name: "Luftfeuchtigkeit Anzeige"
    entity_category: config
    optimistic: true
    restore_value: true

    options:
      - "An"
      - "Aus"

    initial_option: "Aus"

    on_value:
      - lambda: |-
          id(thermostat_ui).redraw(true);

  - platform: template
    id: heating_source
    name: "Heizquelle"
    optimistic: true
    restore_value: true

    options:
      - "Wärmepumpe"
      - "Heizkörper"
      - "Klimaanlage"

    initial_option: "Wärmepumpe"

    on_value:
      - lambda: |-
          id(thermostat_ui).redraw(true);

switch:
  - platform: template
    id: window_open
    name: "Fenster offen"
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF

    turn_on_action:
      - lambda: |-
          id(window_open).publish_state(true);
          id(thermostat_ui).redraw(true);

    turn_off_action:
      - lambda: |-
          id(window_open).publish_state(false);
          id(thermostat_ui).redraw(true);

  - platform: template
    id: notification_present
    name: "Benachrichtigung vorhanden"
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF

    turn_on_action:
      - lambda: |-
          id(notification_present).publish_state(true);
          id(thermostat_ui).redraw(true);

    turn_off_action:
      - lambda: |-
          id(notification_present).publish_state(false);
          id(thermostat_ui).redraw(true);

binary_sensor:
  - platform: template
    id: notification_acknowledged
    name: "Benachrichtigung bestätigt"

output:
  - platform: ledc
    id: display_backlight_pwm
    pin: GPIO46
    frequency: 5000Hz

  - platform: gpio
    id: power_light
    pin: GPIO40

  - platform: gpio
    id: board_out1
    pin: GPIO1

  - platform: gpio
    id: board_out2
    pin: GPIO2

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Hintergrundbeleuchtung"
    output: display_backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s

  - platform: esp32_rmt_led_strip
    id: rgb_ring
    name: "RGB Ring"
    pin: GPIO48
    num_leds: 5
    chipset: WS2812
    channel_colors: GRB
    restore_mode: RESTORE_DEFAULT_OFF

    effects:
      - pulse:
          name: "Pulsierend"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 15%
          max_brightness: 100%


